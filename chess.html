<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахматы</title>
<style>
:root{--bg:#eef3fb;--fg:#0d1b33;--lt:#dbe6f7;--dk:#6f93c9;--card:#fff;--bs:min(94vw,58vh,520px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1224;--fg:#e6efff;--lt:#8aa6d6;--dk:#35507e;--card:#121d38}}
:root[data-theme="dark"]{--bg:#0a1224;--fg:#e6efff;--lt:#8aa6d6;--dk:#35507e;--card:#121d38}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;overflow-x:hidden}
h1{margin:4px 0 0;font-size:1.5rem;letter-spacing:.02em}
#st{min-height:1.4em;font-weight:600;transition:color .3s}
#bw{width:var(--bs);height:var(--bs);position:relative;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(10,30,80,.45),0 0 0 4px var(--card);animation:rise .7s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:perspective(800px) rotateX(35deg) scale(.85);opacity:0}}
#b{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
.s{position:relative;cursor:pointer;transition:box-shadow .2s}
.l{background:var(--lt)}.d{background:var(--dk)}
.last{box-shadow:inset 0 0 0 100px rgba(255,205,0,.38)}
.sel{box-shadow:inset 0 0 0 100px rgba(30,200,120,.5)}
.dot::before{content:"";position:absolute;inset:36%;border-radius:50%;background:rgba(10,30,90,.4);animation:pp .25s}
.cp::before{inset:5%;background:none;border:4px solid rgba(225,40,40,.75)}
@keyframes pp{from{transform:scale(0)}}
.chk{background:radial-gradient(circle,#ff3b3b,transparent 75%);animation:pu .8s infinite}
@keyframes pu{50%{filter:brightness(1.5)}}
#pc{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/8*.82);line-height:1;transition:transform .38s cubic-bezier(.3,.8,.3,1);user-select:none;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.p i{font-style:normal;display:block;transition:transform .2s,filter .2s}
.p.w{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 2px 4px rgba(0,0,0,.5)}
.p.b{color:#101830;text-shadow:0 0 2px #d6e4ff,0 0 1px #d6e4ff,0 2px 4px rgba(0,0,0,.4)}
.p.up i{transform:translateY(-10%) scale(1.18);filter:drop-shadow(0 6px 4px rgba(0,0,0,.45))}
.p.mv{z-index:5}.p.mv i{animation:land .4s}
@keyframes land{0%{transform:scale(1.35)}}
.p.die i{animation:die .4s forwards}
@keyframes die{to{transform:scale(0) rotate(200deg);opacity:0}}
.p.pop i{animation:pop .6s}
@keyframes pop{50%{transform:scale(1.8) rotate(15deg)}}
.p.in i{animation:in .6s backwards}
@keyframes in{from{transform:translateY(-120%) scale(.4);opacity:0}}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,14,34,.72);color:#fff;text-align:center;font-size:1.3rem;font-weight:700;z-index:20;animation:fade .4s;overflow:hidden}
@keyframes fade{from{opacity:0}}
.ov button,.bar button,.bar select{font:inherit;font-size:.95rem;padding:9px 14px;border-radius:10px;border:0;background:#1f6fff;color:#fff;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:var(--bs)}
.bar select{background:var(--card);color:var(--fg);border:1px solid var(--dk)}
.bar button:active,.ov button:active{transform:scale(.94)}
#pr div{display:flex;gap:8px}
#pr button{font-size:2.4rem;padding:4px 12px;background:#e8f0ff;color:#101830}
.cf{position:absolute;top:-10%;width:8px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#vi,#vl{display:none;width:84%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:zin .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes zin{from{transform:scale(0) rotate(-12deg);opacity:0}}
#rvp{justify-content:flex-start;overflow:auto;padding:12px 8px;gap:8px;z-index:30;font-size:.85rem;font-weight:600}
#rvp table{border-collapse:collapse;line-height:1.55}
#rvp td,#rvp th{padding:1px 8px}
#rvp td+td,#rvp th+th{text-align:center}
.bg2{border-radius:99px;padding:0 6px;color:#fff}
#bw{touch-action:none;user-select:none;-webkit-user-select:none}
.p.drag{transition:none;z-index:15}
.p.drag i{transform:scale(1.25);filter:drop-shadow(0 8px 6px rgba(0,0,0,.5))}
#sc{font-size:.85rem;opacity:.75;margin-bottom:8px}
.pre{box-shadow:inset 0 0 0 100px rgba(70,130,255,.55)}
#lb{visibility:hidden;color:#fff;font-weight:700;font-size:.95rem;height:28px;line-height:28px;padding:0 14px;border-radius:999px;max-width:92vw;text-align:center;animation:pp .3s}
#bg{position:absolute;left:0;top:0;width:12.5%;height:12.5%;z-index:9;display:none;pointer-events:none}
#bg::after{content:attr(data-b);position:absolute;top:3%;right:3%;min-width:38%;height:38%;padding:0 4%;box-sizing:border-box;border-radius:999px;background:var(--bc);color:#fff;font-weight:800;font-size:calc(var(--bs)/8*.22);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);animation:bpop .4s .35s backwards}
@keyframes bpop{from{transform:scale(0)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>

<script>
const $=i=>document.getElementById(i),G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'},V={P:100,N:320,B:330,R:500,Q:900,K:0};
const N=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]],O=[[1,0],[-1,0],[0,1],[0,-1]];
const ok=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function init(){const b=Array(64).fill(null),k='RNBQKBNR';for(let i=0;i<8;i++){b[i]='b'+k[i];b[8+i]='bP';b[48+i]='wP';b[56+i]='w'+k[i]}return{b,t:'w',c:{wK:1,wQ:1,bK:1,bQ:1},ep:-1,last:null}}
function att(b,s,by){const r=s>>3,c=s&7,pr=by=='w'?r+1:r-1;
 for(const dc of[-1,1])if(ok(pr,c+dc)&&b[pr*8+c+dc]==by+'P')return 1;
 for(const[a,d]of N)if(ok(r+a,c+d)&&b[(r+a)*8+c+d]==by+'N')return 1;
 for(let a=-1;a<2;a++)for(let d=-1;d<2;d++)if((a||d)&&ok(r+a,c+d)&&b[(r+a)*8+c+d]==by+'K')return 1;
 for(const[L,ts]of[[D,'BQ'],[O,'RQ']])for(const[a,d]of L){let rr=r+a,cc=c+d;while(ok(rr,cc)){const p=b[rr*8+cc];if(p){if(p[0]==by&&ts.includes(p[1]))return 1;break}rr+=a;cc+=d}}
 return 0}
function pm(S,s){const b=S.b,p=b[s],col=p[0],t=p[1],r=s>>3,c=s&7,o=[];
 if(t=='P'){const d=col=='w'?-1:1,st=col=='w'?6:1;
  if(ok(r+d,c)&&!b[(r+d)*8+c]){o.push((r+d)*8+c);if(r==st&&!b[(r+2*d)*8+c])o.push((r+2*d)*8+c)}
  for(const dc of[-1,1]){if(!ok(r+d,c+dc))continue;const q=(r+d)*8+c+dc;if((b[q]&&b[q][0]!=col)||q==S.ep)o.push(q)}}
 else if(t=='N'||t=='K'){for(const[a,d]of t=='N'?N:[...D,...O]){if(!ok(r+a,c+d))continue;const q=(r+a)*8+c+d;if(!b[q]||b[q][0]!=col)o.push(q)}
  if(t=='K'){const e=col=='w'?'b':'w',h=col=='w'?56:0;
   if(s==h+4&&!att(b,s,e)){
    if(S.c[col+'K']&&!b[h+5]&&!b[h+6]&&b[h+7]==col+'R'&&!att(b,h+5,e))o.push(h+6);
    if(S.c[col+'Q']&&!b[h+3]&&!b[h+2]&&!b[h+1]&&b[h]==col+'R'&&!att(b,h+3,e))o.push(h+2)}}}
 else for(const[a,d]of t=='B'?D:t=='R'?O:[...D,...O]){let rr=r+a,cc=c+d;while(ok(rr,cc)){const q=rr*8+cc;if(!b[q])o.push(q);else{if(b[q][0]!=col)o.push(q);break}rr+=a;cc+=d}}
 return o}
function ap(S,f,t,pr){const b=S.b.slice(),p=b[f],col=p[0],c={...S.c};let ep=-1,cap=b[t],epc=-1,rk=null;
 if(p[1]=='P'&&t==S.ep&&!b[t]){epc=t+(col=='w'?8:-8);cap=b[epc];b[epc]=null}
 b[t]=p;b[f]=null;
 if(p[1]=='P'){if(Math.abs(t-f)==16)ep=(f+t)/2;if(t>>3==(col=='w'?0:7))b[t]=col+(pr||'Q')}
 if(p[1]=='K'){c[col+'K']=c[col+'Q']=0;if(t-f==2){rk=[t+1,t-1];b[t-1]=b[t+1];b[t+1]=null}if(f-t==2){rk=[t-2,t+1];b[t+1]=b[t-2];b[t-2]=null}}
 for(const s of[f,t]){if(s==0)c.bQ=0;if(s==7)c.bK=0;if(s==56)c.wQ=0;if(s==63)c.wK=0}
 return{b,t:col=='w'?'b':'w',c,ep,last:[f,t],cap,epc,rk,hm:(p[1]=='P'||cap)?0:(S.hm||0)+1}}
const ksq=(b,c)=>b.indexOf(c+'K'),opp=c=>c=='w'?'b':'w';
const legal=(S,s)=>pm(S,s).filter(t=>{const n=ap(S,s,t);return!att(n.b,ksq(n.b,S.b[s][0]),opp(S.b[s][0]))});
const all=S=>{const m=[];S.b.forEach((p,s)=>{if(p&&p[0]==S.t)legal(S,s).forEach(t=>m.push([s,t]))});return m};
const inChk=S=>att(S.b,ksq(S.b,S.t),opp(S.t));
function ev(S){let s=0;S.b.forEach((p,i)=>{if(!p)return;const r=i>>3,c=i&7,cen=7-Math.abs(2*c-7)/2-Math.abs(2*r-7)/2;let v=V[p[1]]+(p[1]=='P'?(p[0]=='w'?6-r:r-1)*8:p[1]=='K'?0:cen*4);s+=p[0]=='w'?v:-v});return S.t=='w'?s:-s}
function nm(S,d,a,b){if(!d)return ev(S);const ms=all(S);if(!ms.length)return inChk(S)?-9e3-d:0;
 ms.sort((x,y)=>(S.b[y[1]]?1:0)-(S.b[x[1]]?1:0));
 for(const m of ms){const v=-nm(ap(S,m[0],m[1]),d-1,-b,-a);if(v>=b)return b;if(v>a)a=v}return a}
function best(S,d){const ms=all(S).sort(()=>Math.random()-.5);let bs=-1e9,bm=null;
 for(const m of ms){const v=-nm(ap(S,m[0],m[1]),d-1,-1e9,1e9)+Math.random()*(d<2?60:6);if(v>bs){bs=v;bm=m}}return bm}

let S,hist,sel,moves,over,busy,fl=0,vs=1,lvl=2,els,sqs=[],lab=null,pre=null,pk=0;
const ix=k=>fl?63-k:k;
function place(e,s){const k=fl?63-s:s;e.style.transform=`translate(${(k&7)*100}%,${(k>>3)*100}%)`}
function build(){$('pc').innerHTML='';els=Array(64).fill(null);
 S.b.forEach((p,s)=>{if(!p)return;const e=document.createElement('div');e.className='p '+p[0]+' in';e.innerHTML='<i>'+G[p[1]]+'\uFE0E</i>';e.firstChild.style.animationDelay=(Math.random()*.5)+'s';place(e,s);$('pc').appendChild(e);els[s]=e})}
function ui(){const chk=inChk(S)?ksq(S.b,S.t):-1;
 sqs.forEach((e,k)=>{const s=ix(k),cp=moves.includes(s)&&(S.b[s]||(S.b[sel][1]=='P'&&s==S.ep));
  e.className='s '+(((k>>3)+(k&7))%2?'d':'l')+(S.last&&S.last.includes(s)?' last':'')+(s==sel?' sel':'')+(moves.includes(s)?(cp?' dot cp':' dot'):'')+(s==chk?' chk':'')+(pre&&(s==pre[0]||s==pre[1])?' pre':'')});
 els.forEach((e,s)=>e&&e.classList.toggle('up',s==sel));
 $('st').textContent=(pk?'ИИ думает…':S.t=='w'?'Ход белых':'Ход чёрных')+(chk>=0?' — шах!':'');$('st').style.color=chk>=0?'#e53935':'';if(lab)place($('bg'),lab.s)}
function doMove(f,t,pr){hist.push(S);const n=ap(S,f,t,pr),el=els[f],pw=S.b[f][1]=='P'&&n.b[t][1]!='P';
 if(n.cap){const q=n.epc>=0?n.epc:t,ce=els[q];if(ce){ce.classList.add('die');setTimeout(()=>ce.remove(),420);els[q]=null}}
 els[f]=null;els[t]=el;place(el,t);el.classList.add('mv');setTimeout(()=>el.classList.remove('mv'),450);
 if(n.rk){const re=els[n.rk[0]];els[n.rk[0]]=null;els[n.rk[1]]=re;place(re,n.rk[1])}
 if(pw)setTimeout(()=>{el.firstChild.textContent=G[n.b[t][1]]+'\uFE0E';el.classList.add('pop')},300);
 const P=S;S=n;sel=-1;moves=[];ui();after();sv();snd(inChk(n)?(all(n).length?'chk':'mate'):n.rk?'cas':pw?'pro':n.cap?'cap':'mv');const pl=hist.length;setTimeout(()=>{if(S===n){const r=analyze(P,f,t,pr);r.s=P.t;rv[pl-1]=r;show(r,P.t);sv()}},90)}
const LB={br:['Бриллиантовый ход','!!','#14a8bd'],gr:['Великолепный ход','!','#3b82f6'],bs:['Лучший ход','★','#43a047'],ex:['Отличный ход','✓','#689f38'],gd:['Хороший ход','+','#78909c'],op:['Дебютный ход','♙','#8d6e63'],fc:['Вынужденный ход','→','#607d8b'],ina:['Неточность','?!','#c79100'],ms:['Ошибка','?','#ef6c00'],bl:['Зевок','??','#e53935']};
function minAtt(n,s,by){let m=1e9;n.b.forEach((p,i)=>{if(p&&p[0]==by&&pm({b:n.b,c:{},ep:-1,t:by},i).includes(s))m=Math.min(m,p[1]=='K'?99999:V[p[1]])});return m}
function analyze(P,f,t,pr){const n0=ap(P,f,t,pr||'Q');if(inChk(n0)&&!all(n0).length)return{k:'br',loss:0};const ms=all(P);if(ms.length<2)return{k:'fc',loss:0};
 const sc=ms.map(m=>({m,v:-nm(ap(P,m[0],m[1],pr||'Q'),2,-1e9,1e9)})).sort((a,b)=>b.v-a.v);
 const best=sc[0].v,pl=sc.find(x=>x.m[0]==f&&x.m[1]==t).v,loss=best-pl,T=P.b[f][1],me=P.t,op=opp(me),n=ap(P,f,t,pr||'Q');
 let sac=0;if('NBRQ'.includes(T)&&att(n.b,t,op)){const cv=P.b[t]?V[P.b[t][1]]:0;sac=cv<V[T]-100&&(minAtt(n,t,op)<V[T]||!att(n.b,t,me))}
 let k;if(sac&&loss<=15&&pl>-150&&best>-300)k='br';
 else if(loss<=10)k=best-sc[1].v>=150&&best>-400?'gr':'bs';
 else if(loss<=30)k='ex';else if(loss<=70)k=hist.length<=6?'op':'gd';else if(loss<=150)k='ina';else if(loss<=320)k='ms';else k='bl';
 return{k,loss,best}}
function badge(){const b=$('bg');if(!lab){b.style.display='none';return}place(b,lab.s);b.dataset.b=lab.sh;b.style.setProperty('--bc',lab.c);b.style.display='none';b.offsetWidth;b.style.display='block'}
function show(r,side){const L=LB[r.k],w=vs?(side=='w'?'Вы':'ИИ'):(side=='w'?'Белые':'Чёрные'),e=$('lb');lab={s:S.last[1],sh:L[1],c:L[2]};
 e.textContent=w+': '+L[0]+' '+L[1]+(r.loss>30&&r.loss<1500?' (−'+(r.loss/100).toFixed(1)+')':'');e.style.background=L[2];e.style.visibility='visible';badge()}
function clr(){lab=null;$('lb').style.visibility='hidden';$('bg').style.display='none'}
const key=s=>s.b.map(p=>p||'-').join('')+s.t+JSON.stringify(s.c)+s.ep;
function insuf(b){const o=[];b.forEach((p,i)=>{if(p&&p[1]!='K')o.push([p[1],((i>>3)+(i&7))&1])});return!o.length||(o.length==1&&'BN'.includes(o[0][0]))||o.every(x=>x[0]=='B'&&x[1]==o[0][1])}
function dr(){if((S.hm||0)>=100)return'Ничья по правилу 50 ходов';if(insuf(S.b))return'Ничья: недостаточно материала';const k=key(S);return[...hist,S].filter(x=>key(x)==k).length>=3?'Ничья: троекратное повторение':''}
function after(){if(!all(S).length){over=1;const c=inChk(S);rec(c?(S.t=='b'?'w':'l'):'d');setTimeout(()=>end(c?'Мат! Победили '+(S.t=='w'?'чёрные':'белые')+' ♚':'Пат — ничья',c),700)}
 else if(dr()){over=1;rec('d');const m=dr();setTimeout(()=>end(m,0),700)}
 else if(vs&&S.t=='b'){busy=1;pk=1;ui();setTimeout(()=>{const Sx=S;aiAsk(Sx,lvl,m=>{if(S!==Sx||over)return;busy=0;pk=0;if(m)doMove(m[0],m[1],'Q');if(pre)setTimeout(runPre,420)})},400)}}
function runPre(){const q=pre;pre=null;if(!q||over||S.t!='w'||!S.b[q[0]]||S.b[q[0]][0]!='w'){ui();return}
 if(legal(S,q[0]).includes(q[1])){sel=-1;moves=[];doMove(q[0],q[1],'Q')}else ui()}
function end(msg,mate){if(!over)return;$('om').textContent=msg;$('ov').style.display='flex';const lose=mate&&vs&&S.t=='w';$('vi').style.display=mate&&!lose?'block':'none';$('vl').style.display=lose?'block':'none';$('st').textContent=msg;
 if(mate)for(let i=0;i<40;i++){const c=document.createElement('span');c.className='cf';c.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},85%,60%);animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()}s`;$('ov').appendChild(c)}}
function tap(k){if(over)return;const s=ix(k);
 if(pk){const p=S.b[s];
  if(sel>=0&&moves.includes(s)){pre=[sel,s];sel=-1;moves=[]}
  else if(p&&p[0]=='w'){sel=s;moves=pm(S,s);pre=null}
  else{sel=-1;moves=[];pre=null}
  ui();return}
 if(busy||(vs&&S.t=='b'))return;
 if(sel>=0&&moves.includes(s)){const p=S.b[sel];if(p[1]=='P'&&(s>>3==0||s>>3==7)){ask(sel,s);return}doMove(sel,s);return}
 const p=S.b[s];if(p&&p[0]==S.t){sel=s;moves=legal(S,s)}else{sel=-1;moves=[]}ui()}
function ask(f,t){const pb=$('pb');pb.innerHTML='';for(const x of'QRBN'){const b=document.createElement('button');b.textContent=G[x]+'\uFE0E';b.onclick=()=>{$('pr').style.display='none';doMove(f,t,x)};pb.appendChild(b)}$('pr').style.display='flex'}
function reset(){clr();rv=[];pre=null;pk=0;S=init();hist=[];sel=-1;moves=[];over=0;busy=0;$('ov').style.display='none';$('ov').querySelectorAll('.cf').forEach(e=>e.remove());$('pr').style.display='none';$('rvp').style.display='none';build();ui();sv()}
for(let k=0;k<64;k++){const e=document.createElement('div');e.onclick=()=>{if(sup){sup=0;return}tap(k)};$('b').appendChild(e);sqs.push(e)}
$('nw').onclick=reset;$('again').onclick=reset;
function mk(p,s,c){const e=document.createElement('div');e.className='p '+p[0]+' '+(c||'');e.innerHTML='<i>'+G[p[1]]+'\uFE0E</i>';place(e,s);$('pc').appendChild(e);return e}
function undo1(){const P=hist.pop(),[f,t]=S.last,el=els[t];
 if(S.rk){const re=els[S.rk[1]];els[S.rk[1]]=null;els[S.rk[0]]=re;place(re,S.rk[0])}
 if(P.b[f][1]=='P'&&S.b[t][1]!='P')el.firstChild.textContent=G.P+'\uFE0E';
 els[t]=null;els[f]=el;place(el,f);el.classList.add('mv');setTimeout(()=>el.classList.remove('mv'),450);
 if(S.cap){const q=S.epc>=0?S.epc:t;els[q]=mk(P.b[q],q,'in')}
 rv.length=Math.min(rv.length,hist.length);S=P;sel=-1;moves=[];clr();ui();sv()}
$('un').onclick=()=>{if(busy||!hist.length)return;busy=1;const n=vs&&S.t=='w'&&hist.length>=2?2:1;over=0;$('ov').style.display='none';$('ov').querySelectorAll('.cf').forEach(e=>e.remove());undo1();if(n>1)setTimeout(()=>{undo1();busy=0},520);else busy=0};
$('fl').onclick=()=>{fl=!fl;build();ui();sv()};
$('m').onchange=e=>{vs=+e.target.value;reset()};$('lv').onchange=e=>{lvl=+e.target.value;sv()};
let wk=null,wid=0,wcb=null,fbk=null;
function mkWorker(){try{const src=['const N='+JSON.stringify(N),'const D='+JSON.stringify(D),'const O='+JSON.stringify(O),'const V='+JSON.stringify(V),'const ok='+ok,'const ksq='+ksq,'const opp='+opp,'const legal='+legal,'const all='+all,'const inChk='+inChk,att,pm,ap,ev,nm,best].join(';\n')+';\nonmessage=e=>{const{S,d,id}=e.data;postMessage({id,m:best(S,d)})}';
 wk=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
 wk.onmessage=e=>{if(wcb&&e.data.id==wid)wcb(e.data.m)};wk.onerror=()=>{wk=null;if(fbk)fbk()}}catch(x){wk=null}}
function aiAsk(S,d,cb){if(!wk){cb(best(S,d));return}
 const id=++wid;let done=0;
 const fin=m=>{if(done)return;done=1;clearTimeout(tm);wcb=fbk=null;cb(m)};
 const tm=setTimeout(()=>{wk=null;fin(best(S,d))},12000);
 wcb=fin;fbk=()=>fin(best(S,d));
 try{wk.postMessage({S,d,id})}catch(x){wk=null;fin(best(S,d))}}
mkWorker();
const LS='chess5';let rv=[];
function accOf(b,p){const w=c=>50+50*(2/(1+Math.exp(-.00368*Math.max(-1000,Math.min(1000,c))))-1);return Math.max(0,Math.min(100,103.1668*Math.exp(-.04354*(w(b)-w(p)))-3.1669))}
function rvw(){const nn=vs?['Вы','ИИ']:['Белые','Чёрные'],T=[{a:[],c:{}},{a:[],c:{}}];
 rv.forEach(r=>{if(!r)return;const t=T[r.s=='w'?0:1];t.c[r.k]=(t.c[r.k]||0)+1;t.a.push(r.k=='fc'||r.best==null?100:accOf(r.best,r.best-r.loss))});
 const av=t=>t.a.length?Math.round(t.a.reduce((x,y)=>x+y,0)/t.a.length)+'%':'—';
 let h='<div style="font-size:1.1rem">Разбор партии</div><table><tr><th></th><th>'+nn[0]+'</th><th>'+nn[1]+'</th></tr><tr><td>Точность</td><td>'+av(T[0])+'</td><td>'+av(T[1])+'</td></tr>';
 for(const k in LB){const a=T[0].c[k]||0,b=T[1].c[k]||0;if(a||b)h+='<tr><td><span class="bg2" style="background:'+LB[k][2]+'">'+LB[k][1]+'</span> '+LB[k][0]+'</td><td>'+a+'</td><td>'+b+'</td></tr>'}
 $('rvc').innerHTML=h+'</table>';$('rvp').style.display='flex'}
$('rb').onclick=$('rvb').onclick=rvw;$('rvx').onclick=()=>$('rvp').style.display='none';
let AC=null,mu=0;try{mu=+localStorage.getItem(LS+'m')||0}catch(x){}
function tone(f,t0,d,ty,g){const c=AC,o=c.createOscillator(),a=c.createGain(),T=c.currentTime+t0;o.type=ty||'sine';o.frequency.setValueAtTime(f,T);a.gain.setValueAtTime(g||.2,T);a.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(a);a.connect(c.destination);o.start(T);o.stop(T+d+.02)}
function click(t0,g){const c=AC,n=Math.floor(c.sampleRate*.06),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=c.createBufferSource(),f=c.createBiquadFilter(),a=c.createGain();f.type='lowpass';f.frequency.value=1800;a.gain.value=g;s.buffer=b;s.connect(f);f.connect(a);a.connect(c.destination);s.start(c.currentTime+t0)}
function snd(k){try{if(mu)return;if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 if(k=='cap'){click(0,1);click(.07,.7)}else if(k=='cas'){click(0,.8);click(.12,.8)}else if(k=='chk'){click(0,.8);tone(880,.05,.18,'triangle',.15);tone(660,.2,.2,'triangle',.15)}else if(k=='mate'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.35,'triangle',.18))}else if(k=='pro'){click(0,.8);tone(660,.05,.12,'triangle',.15);tone(990,.15,.2,'triangle',.15)}else click(0,.9);
 if(navigator.vibrate)navigator.vibrate({cap:[25,40,25],cas:[20,40,20],chk:[60],mate:[80,50,80,50,200],pro:[30,30,30]}[k]||12)}catch(x){}}
$('sn').textContent=mu?'Звук: выкл':'Звук: вкл';
$('sn').onclick=()=>{mu=mu?0:1;try{localStorage.setItem(LS+'m',mu)}catch(x){}$('sn').textContent=mu?'Звук: выкл':'Звук: вкл';snd('mv')};
let dg=null,sup=0;
function sqAt(x,y){const r=$('b').getBoundingClientRect(),c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);return c<0||c>7||w<0||w>7?-1:ix(w*8+c)}
$('bw').addEventListener('pointerdown',e=>{if(over||dg||['pr','rvp'].some(i=>$(i).style.display=='flex'))return;const s=sqAt(e.clientX,e.clientY);if(s<0||!els[s]||!S.b[s])return;
 const col=S.b[s][0];if(!(pk?col=='w':(!busy&&!(vs&&S.t=='b')&&col==S.t)))return;
 tap(ix(s));dg={s,el:els[s],x:e.clientX,y:e.clientY,mv:0,pk}});
window.addEventListener('pointermove',e=>{if(!dg)return;
 if(!dg.mv){if(Math.hypot(e.clientX-dg.x,e.clientY-dg.y)<7)return;dg.mv=1;dg.el.classList.add('drag')}
 const r=$('b').getBoundingClientRect(),z=r.width/8;dg.el.style.transform='translate('+(e.clientX-r.left-z/2)+'px,'+(e.clientY-r.top-z)+'px)'});
function endDrag(e,cancel){if(!dg)return;const d=dg;dg=null;if(!d.mv)return;sup=1;setTimeout(()=>{sup=0},80);d.el.classList.remove('drag');
 const r=$('b').getBoundingClientRect(),t=cancel?-1:sqAt(e.clientX,e.clientY-r.width/16);
 if(els[d.s]!==d.el||d.pk!==pk||over){if(els[d.s]===d.el)place(d.el,d.s);sel=-1;moves=[];ui();return}
 if(t>=0&&moves.includes(t)){if(pk)place(d.el,d.s);else place(d.el,t);tap(ix(t))}else place(d.el,d.s)}
window.addEventListener('pointerup',e=>endDrag(e));window.addEventListener('pointercancel',e=>endDrag(e,1));
function sv(){try{if(over){localStorage.removeItem(LS+'g');return}localStorage.setItem(LS+'g',JSON.stringify({S,hist,vs,lvl,fl,rv}))}catch(x){}}
function stats(){try{return JSON.parse(localStorage.getItem(LS+'s'))||{w:0,l:0,d:0}}catch(x){return{w:0,l:0,d:0}}}
function showSt(){const s=stats();$('sc').textContent='Против ИИ — победы: '+s.w+', поражения: '+s.l+', ничьи: '+s.d}
function rec(r){if(!vs)return;try{const s=stats();s[r]++;localStorage.setItem(LS+'s',JSON.stringify(s))}catch(x){}showSt()}
function load(){try{const d=JSON.parse(localStorage.getItem(LS+'g'));if(!d||!d.S||!d.hist)return 0;S=d.S;hist=d.hist;rv=d.rv||[];vs=d.vs;lvl=d.lvl;fl=d.fl;sel=-1;moves=[];over=0;busy=0;$('m').value=vs?1:0;$('lv').value=lvl;build();ui();if(vs&&S.t=='b')after();return 1}catch(x){return 0}}
showSt();load()||reset();
</script></body></html>
